name: Gerar APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Compilar TreinoSmart
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validar analise em Python
        run: |
          PYTHONPATH=. python3 -m unittest discover -s analytics/tests -v

      - name: Compilar APK de teste
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: TreinoSmart-APK-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
