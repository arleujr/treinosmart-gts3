<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"/><title>TreinoSmart — mostrador experimental</title>
<style>body{font-family:system-ui,sans-serif;background:#dce5f1;display:flex;flex-direction:column;align-items:center;gap:18px;padding:30px;color:#1a2640}.watch{width:240px;height:296px;background:#0a1525;border:9px solid #202b39;border-radius:45px;display:flex;flex-direction:column;justify-content:space-around;align-items:center;color:white;box-shadow:0 15px 50px #667894;padding:14px;box-sizing:border-box}.small{color:#9fb4d0;font-size:11px}.exercise{font-size:17px;font-weight:700;letter-spacing:.4px}.big{font-size:40px;font-weight:800}.hr{color:#ff8d92}button{border:0;background:#164c97;color:#fff;border-radius:8px;padding:9px 16px;cursor:pointer}p{max-width:420px;text-align:center}</style></head>
<body><h2>TreinoSmart — conceito de tela no GTS 3</h2><div class="watch"><div class="small">TREINO EM ANDAMENTO</div><div class="exercise" id="ex">SUPINO RETO</div><div id="set">SÉRIE 2 / 4</div><div class="big" id="timer">01:12</div><div class="small" id="phase">DESCANSO</div><div class="hr">♥ <b id="bpm">118</b> BPM</div></div><button onclick="flip()">Alternar exemplo</button><p>Simulação no navegador. A resolução, suporte a campos dinâmicos e comandos de interação ainda precisam ser medidos no seu relógio. Não é arquivo de firmware nem mostrador instalável.</p><script>let a=0;function flip(){a++;document.querySelector('#phase').textContent=a%2?'EXECUÇÃO':'DESCANSO';document.querySelector('#timer').textContent=a%2?'00:39':'01:12';document.querySelector('#bpm').textContent=a%2?'136':'118'}</script></body></html>
